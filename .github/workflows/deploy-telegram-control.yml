name: Deploy Telegram control (manual approval only)

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Explicitly approve deploying the Telegram control Edge Function to production"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.confirm_production_deploy == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TELEGRAM_SETUP_SECRET: ${{ secrets.TELEGRAM_SETUP_SECRET }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$TELEGRAM_SETUP_SECRET" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, and TELEGRAM_SETUP_SECRET are required"
            exit 1
          fi
      - name: Deploy only telegram-control
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy telegram-control --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Register Telegram webhook
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TELEGRAM_SETUP_SECRET: ${{ secrets.TELEGRAM_SETUP_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/telegram-control" \
            -H "content-type: application/json" \
            -H "x-telegram-setup-secret: $TELEGRAM_SETUP_SECRET" \
            --data '{"action":"set_webhook"}'
